# VerOps presence-report webhook receiver
# Deployed as ROOT.war on MochaHost shared Tomcat
# Context path is / (ROOT); /verops prefix is in the controller mapping.

# Shared secret — must match the "Auth header value" configured in VerOps.
# Header name sent by VerOps: X-Webhook-Token
webhook.auth.token=631bd4d6b9e04efb900485a5c7267a94b8d126aed30549faac11ebcf4d633a17

# Storage directory for incoming presence reports.
# The directory is created on startup if it does not already exist.
presence.report.storage-dir=/home/ifaru02/attunedtechnology.com/verops/demo/presence-report

# Allow multipart uploads up to 50 MB (CSV/PDF reports are tiny in practice).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.attunedtechnology.verops=INFO
